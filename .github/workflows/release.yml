name: Release

# Push a tag like `v0.1.0` after bumping versionName/versionCode in app/build.gradle.kts.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Assemble release APK
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      # The Karoo reads this manifest (see MANIFEST_URL in AndroidManifest.xml) to install and update the app.
      - name: Write Karoo manifest
        run: |
          version_name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          version_code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          base_url="https://github.com/${{ github.repository }}/releases/latest/download"
          jq -n \
            --arg version "$version_name" \
            --argjson code "$version_code" \
            --arg apk "$base_url/karoo-power-compare.apk" \
            '{
              label: "Power Compare",
              packageName: "io.github.alexgaignard.powercompare",
              latestApkUrl: $apk,
              latestVersion: $version,
              latestVersionCode: $code,
              developer: "alexgaignard",
              description: "Compare two power meters live: the Karoo power meter against a second BLE power meter.",
              tags: ["performance"]
            }' > manifest.json
          cp app/build/outputs/apk/release/app-release.apk karoo-power-compare.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            karoo-power-compare.apk
            manifest.json
